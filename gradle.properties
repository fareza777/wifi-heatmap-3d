android.useAndroidX=true
# SceneView 4.x ships Kotlin 2.4 bytecode; AGP's built-in Kotlin is 2.2, so drive KGP
# ourselves. KGP needs the legacy DSL, which AGP 9 documents as the supported opt-out.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official

